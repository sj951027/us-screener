# 미국판 데이터 수집 — GitHub Actions 자동 실행 (노트북 불필요)
# 매일 03:17 UTC(화~토) = 한국 낮 12:17 · 전날 미국 거래일(월~금 ET) 마감분 수집
# v11 2026-09-17: 22:00 UTC → 03:17 UTC. GitHub 스케줄 지연(9월 ~2시간)으로 실행이 00:00 UTC(=20:00 ET) 전후로
#   밀리면서 야후 일봉 당일분이 16%만 오는 결함이 9회 연속(실측: 루프가 20:00 ET 전에 끝나면 정상, 넘기면 16~80%).
#   날짜 판정은 'ET 06시 이전이면 전날 세션'으로 바꿔(v11) 지연돼 ET 자정을 넘겨도 같은 거래일로 본다.
# 데이터 보관: git 커밋이 아니라 Release 자산(us-data.tar.gz) — repo 비대화 방지.
# 수동 실행: Actions 탭 → collect-us-data → Run workflow
name: collect-us-data

on:
  schedule:
    - cron: '17 3 * * 2-6'   # v11: 정시 혼잡 회피(17분) · 화~토 UTC = 월~금 ET 세션
  workflow_dispatch:
    inputs:
      price_repair_dates:
        # v18: 두 입력의 역할이 헷갈려 설명에 ①②와 '언제 쓰는지'를 적는다(이름은 그대로 — 기존 기록과 호환)
        description: '① 시세 복구 — 빠진 시세 행을 다시 받을 날짜(YYYYMMDD, 콤마). 점수는 최근 10거래일 안이면 자동 보충. 보통은 비워 둠'
        required: false
        default: ''
      repair_dates:
        # v08 2026-09-06: 부분 수집일(시세 일부 배치 누락)에 박제된 점수를 감사 로그와 함께
        #   재계산 — 수동 전용(스케줄 실행은 절대 안 씀). 예: 20260902,20260903
        description: '② 점수 재계산 — 이미 적재된 score_daily 를 지우고 다시 계산할 날짜(YYYYMMDD, 콤마). 시세가 완결된 날만. 결과는 로그 🛠 REPAIR 줄. 보통은 비워 둠'
        required: false
        default: ''
      allow_fresh_start:
        # v19: 정본(us-data.tar.gz·weekly)이 둘 다 없을 때만 '빈 DB 새 시작'을 허용하는 수동 확인. 비어 있으면 새 시작 대신 중단.
        description: '③ 빈 새 시작 허용 — 정본이 모두 사라졌을 때만 yes (평소엔 비워 둠)'
        required: false
        default: ''

permissions:
  contents: write

# v08: 스케줄과 수동 실행이 겹치면 같은 정본을 받아 마지막 업로드가 다른 run 의 진행을 지움 → 직렬화
concurrency:
  group: collect-us
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # v2026-07-26: 주1회 SEC 벌크 2종(각 ~1.3GB) 겹치는 날 여유
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Download data store (previous state)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v2026-07-26 방어 강화: '다운로드는 됐는데 tar 가 손상'인 경우를 빈 상태
          # 새 시작과 구분 — 손상 tar 로 조용히 처음부터 재수집하면 몇 년치 정본을
          # 하루짜리로 덮어쓸 수 있다(치명). 손상이면 즉시 실패 → 주간 백업으로 수동 복구.
          # v08 2026-09-06: '자산이 없다'와 '다운로드가 실패했다'를 구분 — 네트워크/API 오류를
          #   새 시작으로 오인하면 빈 DB 로 3년 정본을 덮어쓴다(리뷰 H1). 조회 실패·다운로드 실패는 중단.
          set +e
          names=$(gh release view data-store --json assets -q '.assets[].name' 2>view_err.txt); rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            if grep -qi "not found" view_err.txt; then
              # v19: 부트스트랩이 끝난 뒤 '새로 시작'이 정상인 경우는 없다 — 수동 확인 없이는 중단(정본 복구 절차: 지식 문서 §7)
              if [ "${{ github.event.inputs.allow_fresh_start }}" != "yes" ]; then echo "❌ 릴리스 없음 — 빈 새 시작은 allow_fresh_start=yes 필요. 복구 절차: US_PROJECT_KNOWLEDGE.md §7"; exit 1; fi
              echo "릴리스 없음(최초) — 새로 시작(allow_fresh_start=yes)"
            else
              cat view_err.txt; echo "❌ 릴리스 조회 실패(네트워크/API) — 빈 재시작 방지 중단"; exit 1
            fi
          elif echo "$names" | grep -qx 'us-data.tar.gz'; then
            gh release download data-store --pattern 'us-data.tar.gz' --dir . || { echo "❌ 정본 다운로드 실패 — 빈 재시작 방지 중단"; exit 1; }
            tar xzf us-data.tar.gz || { echo "❌ us-data.tar.gz 손상 — 중단(빈 재시작 방지). us-data-weekly.tar.gz 로 복구 필요"; exit 1; }
            cp us-data.tar.gz us-data-prev.tar.gz     # 주간 백업은 '직전 일일본'으로(오늘 run 이 오염돼도 백업은 무사)
            echo "PREV_TAR_BYTES=$(stat -c%s us-data.tar.gz)" >> "$GITHUB_ENV"
          elif echo "$names" | grep -qx 'us-data-weekly.tar.gz'; then
            # v14: 일일 정본만 없고 주간 백업은 있음 = 자산 소실(업로드 중 취소·타임아웃 등). '새로 시작'으로 오인하면
            #   PREV_TAR_BYTES 가 비어 50% 가드가 꺼진 채 며칠치 tar 가 --clobber 로 정본 자리를 차지한다.
            echo "❌ us-data.tar.gz 만 없고 us-data-weekly.tar.gz 는 있음 — 자산 소실로 판단, 빈 재시작 중단."
            echo "   복구: 주간 백업을 내려받아 us-data.tar.gz 이름으로 release 에 다시 올린 뒤 재실행"; exit 1
          else
            if [ "${{ github.event.inputs.allow_fresh_start }}" != "yes" ]; then echo "❌ 정본·주간 백업 모두 없음 — 빈 새 시작은 allow_fresh_start=yes 필요. 복구 절차: US_PROJECT_KNOWLEDGE.md §7"; exit 1; fi   # v19
            echo "자산 없음(릴리스만 존재) — 새로 시작(allow_fresh_start=yes)"
          fi
          # 주간 백업 요일을 잡 시작 시점에 고정(리뷰 L4). v11: 'ET 세션 요일'(ET 06시 이전이면 전날) — 화~토 UTC 실행과 맞춤
          # v17: 규칙은 us_calendar.py 한 곳 — `python us_calendar.py` 가 ISO 요일(월=1…일=7)을 찍는다
          # v20: 세션 날짜를 잡 시작에 한 번 고정 — 뒤쪽 스텝(옵션·애널리스트·알림)이 ET 06시를 넘겨도 같은 세션으로 판정
          # v22: 잡 시작 판정만 'ET 09시 이전 = 전날 세션'으로 넓힌다(정규장 개장 09:30 전). GitHub 스케줄 지연이 6시간 48분까지 늘어
          #   10-01 실행이 ET 06:05 에 시작 → 세션이 하루 넘어가 옵션·추정치·순위 알림이 '휴장'으로 생략됐다(patch_note/v22).
          #   us_calendar.py 의 기본값(6)은 그대로 두고(사전등록 §4 판정 기간 중 무수정) 여기서만 덮어쓴다. 요일도 같은 날짜에서 계산.
          WF_ROLLOVER_H=9
          SESSION=$(python -c "import us_calendar as c; c.SESSION_ROLLOVER_H=$WF_ROLLOVER_H; print(c.session_date())")
          echo "US_SESSION_DATE=$SESSION" >> "$GITHUB_ENV"
          echo "RUN_DOW=$(US_SESSION_DATE=$SESSION python us_calendar.py)" >> "$GITHUB_ENV"
          mkdir -p us-screener-data
          ls -la us-screener-data/ || true

      # v19: 추가 전용 테이블 행수 스냅샷 — 업로드 직전 us_integrity check 가 감소(작은 테이블 소실)를 잡는다
      - name: Row counts (before)
        env:
          US_DATA_DIR: ${{ github.workspace }}/us-screener-data
        run: python us_integrity.py snapshot "$RUNNER_TEMP/rows_before.json"

      # v10 2026-09-12: 러너 출구 IP 기록 — 수집 수확량이 러너마다 크게 다른데(실측 #53·#54 westcentralus 정상,
      #   #55 eastus2 16%) 로그에 IP 가 없어 대조가 불가능했다. GitHub 호스티드 러너(Azure)의 일회용 주소라
      #   공개 로그에 남아도 개인정보가 아니다. 실패해도 비치명(continue-on-error).
      - name: Runner fingerprint (수집 실패 대조용)
        continue-on-error: true
        run: |
          ip=$(curl -s --max-time 10 https://api.ipify.org || true)
          [ -n "$ip" ] || ip=$(curl -s --max-time 10 https://checkip.amazonaws.com || true)
          ip=$(echo "$ip" | tr -d '[:space:]')
          echo "RUNNER_IP=${ip:-unknown}" >> "$GITHUB_ENV"   # 이후 스텝에 자동 전달 → us_ohlcv_collector 가 찍는다
          echo "출구 IP: ${ip:-unknown}"

      - name: Run collectors
        env:
          US_DATA_DIR: ${{ github.workspace }}/us-screener-data
          US_SEED_DB: ${{ github.workspace }}/us-screener-data/us_seed.db
          # v2026-08-19: SEC 403 대응 — 기본 UA(괄호/세미콜론/URL 포함)가 차단 용의자.
          #   SEC 권장 형식은 '이름 이메일' 단순형. 수집기 3종 모두 이 변수를 읽는다.
          SEC_USER_AGENT: "us-screener seok5139@gmail.com"
        run: |
          python us_seed_collector.py
          python us_ohlcv_collector.py
          python us_market_series.py
          python us_rotate_collector.py
          python us_short_collector.py
          # v07 2026-09-06 데이터 확장 5차: FINRA 일별 공매도 거래량(Reg SHO daily) — 관측 전용,
          #   2023-05 부터 회당 150파일 점진 백필(~6회), 완료 후엔 done 건너뜀. 비치명.
          python us_shortvol_collector.py --backfill-from 2023-05-01
          # v2026-07-26 데이터 확장 1·2차: SEC 벌크 (둘 다 주간 가드 내장 — 실제 수집은
          #   주1회, 비치명·관측 전용). ① XBRL 재무 ② 실적 발표일(8-K Item 2.02).
          #   저평가/PEAD(SUE)/재무모멘텀 검증 재료(본구축 9월).
          python us_xbrl_collector.py
          python us_earnings_collector.py
          # 3차: Form 4 내부자(분기 구조화셋, 회당 4분기 점진 백필 — ~1주에 걸쳐 완성)
          python us_insider_collector.py

      # v13 2026-09-27: 복구 실패가 '오늘 수집분 폐기'로 번지지 않게 한다(실측 러너 #36290533184:
      #   9/22 는 이미 6,564/6,566 까지 찼는데 잔여 2종목 때문에 업로드까지 중단됐다).
      #   실패해도 점수·업로드는 진행하고, 업로드 뒤 전용 스텝에서 실행을 실패로 표시한다.
      - name: Repair missing prices and audit history
        id: price_repair
        continue-on-error: true
        env:
          US_DATA_DIR: ${{ github.workspace }}/us-screener-data
          PRICE_REPAIR_DATES: ${{ github.event.inputs.price_repair_dates }}
        run: |
          rc=0
          if [ -n "$PRICE_REPAIR_DATES" ]; then python us_price_repair.py --dates "$PRICE_REPAIR_DATES" || rc=$?; fi
          python us_price_repair.py --audit || true    # 읽기 전용 점검 — 복구가 실패해도 찍는다
          exit "$rc"

      - name: Build page data (docs/data/us_latest.csv)
        id: page_data
        continue-on-error: true   # v19: 강제 종료(OOM 등)도 오늘 수집분 업로드를 막지 않게 — 실패는 아래 알림에 표시
        env:
          US_DATA_DIR: ${{ github.workspace }}/us-screener-data
          REPAIR_DATES: ${{ github.event.inputs.repair_dates }}
        run: |
          # v08: 수동 입력이 있을 때만 부분 수집일 점수 재계산(감사 로그 출력) — 그 다음 정상 적재
          # v19: 재계산 실패(exit 1)는 기록만 하고 계속 — 업로드 뒤 'Repair result gate' 가 실행을 실패로 표시
          if [ -n "$REPAIR_DATES" ]; then
            python us_page_data.py --repair "$REPAIR_DATES" || echo "SCORE_REPAIR_FAILED=1" >> "$GITHUB_ENV"
          fi
          python us_page_data.py

      # v05 2026-08-30 데이터 확장 4차: 옵션 요약 스냅샷 — 소급 불가 데이터라 선제 적재.
      #   page_data 뒤 = 오늘 score_daily 반영된 관측 모델 종목 포함. 비치명·휴장일 가드 내장.
      - name: Options snapshot (관측 전용)
        id: options
        timeout-minutes: 45       # v19: 예산 2,100초 + 여유. 멈추면 잡 180분 한도가 업로드까지 삼킨다
        continue-on-error: true   # v19: 관측 전용 — 실패가 정본 업로드를 막지 않게
        env:
          US_DATA_DIR: ${{ github.workspace }}/us-screener-data
        # v06 2026-09-06: 첫 5일 실측(516/516 성공·잘림 0·211s)으로 확대 합의 조건 충족 → top1000
        run: python us_options_collector.py --max-symbols 1000

      # v20 2026-09-27: 애널리스트 추정치 스냅샷(소급 불가 → 오늘부터 누적) + 등급·목표가 변경 이력(소급 가능, 회당 300종목 순환).
      #   관측 전용·비치명. 스냅샷은 유동성 상위 500 ∪ 관측 모델 종목(옵션 첫 적재와 같은 보수적 시작 — 실측 뒤 확대 검토).
      - name: Analyst snapshot (관측 전용)
        id: analyst
        timeout-minutes: 30
        continue-on-error: true
        env:
          US_DATA_DIR: ${{ github.workspace }}/us-screener-data
        run: python us_analyst_collector.py

      - name: Commit page data (GitHub Pages 갱신)
        id: pages
        continue-on-error: true   # v08: 푸시 실패가 DB 업로드를 막지 않게(리뷰 H3) — 페이지는 다음날 따라잡음
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # v2026-07-18: us_tilt.csv(급등형 틸트 관측) 함께 커밋 — 없으면 무시(비치명)
          git add docs/data/us_latest.csv
          git add docs/data/us_tilt.csv 2>/dev/null || true
          git add docs/data/us_history.json 2>/dev/null || true   # v20: 모델별 과거 기록·등락(us_history.html)
          # v21: 동시에 대기하던 실행이 먼저 페이지를 갱신했으면(충돌) 이번 커밋은 버리고 넘어간다 — 정본 업로드는 계속
          git diff --cached --quiet || (git commit -m "data: us_latest 자동 갱신" && { git pull --rebase || { git rebase --abort; echo "::warning::다른 실행이 먼저 페이지를 갱신 — 이번 페이지 커밋 생략"; exit 0; }; } && git push)

      # 손상된 DB 를 업로드하면 멀쩡한 이전본을 덮어써 버린다 — quick_check 통과 시에만 진행.
      # v19: + 추가 전용 테이블 행수 감소 검사(us_integrity.py). score_daily 같은 작은 테이블이 비어도 50% 크기 게이트는 통과했다.
      - name: Integrity gate (손상·행수 감소 DB 업로드 차단)
        env:
          US_DATA_DIR: ${{ github.workspace }}/us-screener-data
          REPAIR_DATES: ${{ github.event.inputs.repair_dates }}
        run: python us_integrity.py check "$RUNNER_TEMP/rows_before.json"

      - name: Upload data store
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf us-data.tar.gz us-screener-data
          # v08: 새 tar 가 직전의 50% 미만이면 정본 훼손 의심 — 업로드 중단(리뷰 H1 2차 방어)
          new_bytes=$(stat -c%s us-data.tar.gz)
          if [ "$new_bytes" -gt 1610612736 ]; then echo "::warning::정본 tar $(du -h us-data.tar.gz | cut -f1) — Release 자산 2GB 한도 근접(1.5GiB 초과), 분할 검토"; fi   # v19
          if [ -n "${PREV_TAR_BYTES:-}" ] && [ "$new_bytes" -lt $((PREV_TAR_BYTES / 2)) ]; then
            echo "❌ 새 tar ${new_bytes}B < 직전 ${PREV_TAR_BYTES}B 의 50% — 정본 훼손 의심, 업로드 중단"; exit 1
          fi
          gh release view data-store >/dev/null 2>&1 || gh release create data-store --title "US data store" --notes "수집 데이터 자동 보관용 (매일 갱신)"
          gh release upload data-store us-data.tar.gz --clobber
          echo "업로드 완료: $(du -h us-data.tar.gz | cut -f1)"
          # 금요일 세션(잡 시작 시점 ET 세션 요일, v11)엔 주간 백업본 — v08: '직전 일일본'을 보관해 오늘 run 오염과 분리
          if [ "${RUN_DOW:-$(python us_calendar.py)}" = "5" ]; then
            if [ -f us-data-prev.tar.gz ]; then cp us-data-prev.tar.gz us-data-weekly.tar.gz; else cp us-data.tar.gz us-data-weekly.tar.gz; fi
            gh release upload data-store us-data-weekly.tar.gz --clobber
            echo "주간 백업본 갱신(금요일, 직전 일일본)"
          fi

      # v19: 텔레그램을 업로드 뒤로 — '정상' 상위10 을 받은 뒤 '❌ 실패'가 따로 오던 순서 정리. 업로드가 실패하면
      #   이 스텝은 건너뛰고 아래 실패 알림만 간다(DB 는 업로드로 바뀌지 않으므로 내용은 같다).
      - name: Telegram test notice (관측 표시 — 매수신호 아님)
        id: notify
        continue-on-error: true
        env:
          US_DATA_DIR: ${{ github.workspace }}/us-screener-data
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 수동 실행은 휴장일 가드 무시하고 항상 전송 (스케줄 실행은 휴장 시 생략)
          TELEGRAM_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python us_notify_test.py

      # v13: 업로드까지 끝낸 뒤에 복구 실패를 실행 결과로 남긴다(빨간 실패 + 아래 텔레그램 알림 유지).
      - name: Repair result gate
        if: steps.price_repair.outcome == 'failure' || env.SCORE_REPAIR_FAILED == '1'
        run: |
          [ "${{ steps.price_repair.outcome }}" = "failure" ] && echo "❌ 시세 복구 미완료 — 로그 '[시세 복구]' 줄에서 잔여 종목 확인"
          [ "${SCORE_REPAIR_FAILED:-}" = "1" ] && echo "❌ 점수 재계산(repair_dates) 미완료 — 로그 '🛠 REPAIR'·'::error::' 줄 확인"   # v19
          echo "(오늘 수집분은 정본에 반영됨)"
          exit 1

      # v19: 취소·타임아웃에도(cancelled), 비치명 페이지 푸시 실패에도 알림. 문구에 스텝별 결과를 넣어 급한지(업로드 실패)
      #   아닌지(복구 게이트만 실패 — 정본은 반영됨) 바로 구분되게.
      - name: Failure alert (실패 시 텔레그램 한 줄)
        # v21: continue-on-error 스텝은 실패해도 job 은 성공이라 failure() 로 안 잡힌다 — 스텝별 outcome 을 조건에 직접 넣는다(Codex 검토 7)
        if: >-
          failure() || cancelled() || steps.pages.outcome == 'failure' || steps.page_data.outcome == 'failure' ||
          steps.options.outcome == 'failure' || steps.analyst.outcome == 'failure' || steps.notify.outcome == 'failure' ||
          env.SOFT_FAIL_PAGE == '1' || env.SOFT_FAIL_NOTIFY == '1' || env.SOFT_FAIL_ANALYST == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ [US] collect-us-data ${{ job.status == 'success' && '(일부 단계 실패 · 정본 업로드는 정상)' || job.status }} — 정본 업로드 ${{ steps.upload.outcome || '미실행' }} · 점수·페이지 ${{ steps.page_data.outcome || '-' }} · 페이지 푸시 ${{ steps.pages.outcome || '-' }} · 옵션 ${{ steps.options.outcome || '-' }} · 애널리스트 ${{ steps.analyst.outcome || '-' }} · 알림 ${{ steps.notify.outcome || '-' }} · 삼킨 실패 ${{ env.SOFT_FAIL_PAGE && '점수·페이지 ' || '' }}${{ env.SOFT_FAIL_NOTIFY && '알림 ' || '' }}${{ env.SOFT_FAIL_ANALYST && '애널리스트' || '' }} · 시세 복구 ${{ steps.price_repair.outcome || '-' }} — 로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
